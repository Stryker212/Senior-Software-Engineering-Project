<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Oregon Multi-Layer Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100%; width: 100%; }
    .legend {
      background: white;
      padding: 10px 12px;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      font-family: Arial, sans-serif;
      font-size: 13px;
      line-height: 1.3;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    const MAP_START = {"lat": 44.0, "lon": -120.5, "zoom": 6};
    const VECTOR_LAYERS = [{"name": "Wildfires (2000\u20132022)", "url": "../../Data/Events/wildfire_points_2000_2022.geojson", "type": "point", "color": "#ff3b30", "radius": 2.0, "opacity": 0.85}, {"name": "Landslides", "url": "../../Data/Events/landslide_points.geojson", "type": "point", "color": "#0a84ff", "radius": 2.0, "opacity": 0.85}];
    const TILE_LAYERS = [];

    const map = L.map("map").setView([MAP_START.lat, MAP_START.lon], MAP_START.zoom);

    const base = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    const overlayMaps = {};

    // ---- Tile overlays (rasters) ----
    TILE_LAYERS.forEach(t => {
      const layer = L.tileLayer(t.url, {
        minZoom: t.minZoom,
        maxZoom: t.maxZoom,
        opacity: t.opacity
      });
      overlayMaps[t.name] = layer;
    });

    // ---- Vector overlays (geojson) ----
    async function loadGeoJSONLayer(cfg) {
      const res = await fetch(cfg.url);
      if (!res.ok) {
        // IMPORTANT: do NOT use template literals here (backticks) because this HTML is generated by Python.
        throw new Error("Failed to load " + cfg.name + ": " + cfg.url + " (" + res.status + ")");
      }
      const gj = await res.json();

      function pointStyle(feature, latlng) {
        return L.circleMarker(latlng, {
          radius: cfg.radius,
          color: cfg.color,
          fillColor: cfg.color,
          fillOpacity: cfg.opacity,
          opacity: cfg.opacity,
          weight: 0
        });
      }

      const layer = L.geoJSON(gj, {
        pointToLayer: (feature, latlng) => pointStyle(feature, latlng)
      });

      return layer;
    }

    (async () => {
      for (const cfg of VECTOR_LAYERS) {
        try {
          const lyr = await loadGeoJSONLayer(cfg);
          overlayMaps[cfg.name] = lyr;
          // default ON
          lyr.addTo(map);
        } catch (err) {
          console.error(err);
          alert(err.message);
        }
      }

      // Add layer control after layers exist
      L.control.layers({ "OpenStreetMap": base }, overlayMaps, { collapsed: false }).addTo(map);

    })();
  </script>
</body>
</html>
